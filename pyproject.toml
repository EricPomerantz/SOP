[project]
name = "sopvision"
version = "0.1.0"
description = "Live SOP monitoring: object detection + Jev decisions + web dashboard"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "ultralytics",
    "torch",
    "torchvision",
    "numpy",
    "scipy",
    "pydantic>=2",
    "pydantic-settings",
    "pyyaml",
    "ruamel.yaml",
    "typer",
    "fastapi",
    "uvicorn[standard]",
    "httpx",
    "typesafe-sdk",
]

[project.scripts]
sopvision = "sopvision.cli:app"

[dependency-groups]
dev = ["pytest", "pytest-asyncio"]
training = ["transformers", "accelerate", "pillow"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sopvision"]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu128" }]
torchvision = [{ index = "pytorch-cu128" }]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "gpu: needs CUDA",
    "jev: calls the real Jev API",
    "slow: long-running",
    "dataset: needs the server_fan dataset",
]
addopts = "-m 'not gpu and not jev' --import-mode=importlib"
pythonpath = ["."]
