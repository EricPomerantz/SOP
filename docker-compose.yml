services:
  sopvision:
    build: .
    image: sopvision:latest
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      SOP_DATA_ROOT: /data/server_fan
      DATASETS_DIR: /datasets
      DECISION_MODE: ${DECISION_MODE:-jev}  # from the shell or .env: jev | decider | laya | compare
      COMPARE_SHADOW: ${COMPARE_SHADOW:-decider}  # compare mode's shadow model: decider | laya
      DECIDER_URL: http://decider:8001
      LAYA_URL: http://laya:8000
    volumes:
      - ${SOP_DATASET_DIR:-./sop-sample-training-data}:/data:ro
      - ./src:/app/src:ro
      - ./scripts:/app/scripts:ro
      - ./benchmarks:/app/benchmarks  # frozen decision benchmarks (written once by scripts/freeze_benchmark.py)
      - ./models:/app/models:ro
      - ./runs:/app/runs
      - ./sops:/app/sops:ro
      - ./data/scenarios:/app/data/scenarios:ro
      - ./data/training:/app/data/training  # fine-tuning captures and datasets (scripts/capture_requests.py)
      - ./datasets:/datasets  # timeline-format datasets: new SOPs' recordings (writable: the dashboard records here)
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  # Unit tests in Docker: `docker compose --profile test run --rm tests` (add pytest args after `tests`).
  tests: &tests
    profiles: [test]
    build:
      context: .
      target: test
    image: sopvision:test
    environment:
      DECIDER_URL: http://decider:8001  # for `-m decider` (the Decider service must be up)
      LAYA_URL: http://laya:8000
      SOP_DATA_ROOT: /data/server_fan
      DATASETS_DIR: /datasets
      PYTHONDONTWRITEBYTECODE: "1"
    volumes:
      - ./src:/app/src:ro
      - ./tests:/app/tests:ro
      - ./training:/app/training:ro
      - ./scripts:/app/scripts:ro
      - ./sops:/app/sops:ro
      - ./pyproject.toml:/app/pyproject.toml:ro
      - ${SOP_DATASET_DIR:-./sop-sample-training-data}:/data:ro
      - ./datasets:/datasets:ro
      - ./models:/app/models:ro
      - ./data:/app/data:ro
      - ./benchmarks:/app/benchmarks:ro

  gpu-tests:
    <<: *tests
    profiles: [test-gpu]
    env_file:
      - path: .env
        required: false
    command: ["-m", "gpu or jev or decider or dataset"]
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  web-tests:
    profiles: [test]
    build:
      context: .
      target: web-tests
    image: sopvision:web-tests

  web-dev:
    profiles: [dev]
    build:
      context: .
      target: web-dev
    image: sopvision:web-dev
    ports:
      - "5173:5173"
    volumes:
      - ./web/src:/web/src:ro
      - ./web/index.html:/web/index.html:ro
      - ./web/vite.config.ts:/web/vite.config.ts:ro
      - ./web/tsconfig.json:/web/tsconfig.json:ro

  # Local Decider (Mapika/decider-4b): `docker compose --profile decider up -d decider`.
  # Not a dependency of sopvision on purpose: DECISION_MODE=jev must keep working when it is down.
  decider:
    profiles: [decider]
    build:
      context: .
      dockerfile: docker/decider.Dockerfile
      additional_contexts:
        certs: ${CORP_CA_DIR:-./docker/certs}
    image: sopvision-decider:latest
    ports:
      - "8001:8001"
    environment:
      DECIDER_REPO: Mapika/decider-4b
      DECIDER_REVISION: ${DECIDER_REVISION:-eb5fbdfc9448473ec25e399882912863afbdb70e}
      # VRAM: our requests are ~0.5-1k tokens per question row, so capture CUDA graphs for small shapes only
      # (the defaults go to 8192 tokens x batch 32). Longer rows still work, eagerly.
      DECIDER_T_BUCKETS: 64,128,256,512,768,1024,1536,2048
      DECIDER_B_BUCKETS: 1,2,4
      DECIDER_GRAPH_TOKEN_BUDGET: "8192"
      DECIDER_SHARED_FORK_GB: "1"
      # Requests whose shortest question row has at least this many tokens run the state once and fork it per
      # question instead of once per question (server default 768; our rows are ~700-1000 tokens).
      DECIDER_SHARED_MIN_TOKENS: ${DECIDER_SHARED_MIN_TOKENS:-768}
      DECIDER_MAX_STATE_TOKENS: "4096"
      DECIDER_MAX_BATCH: "4"
    volumes:
      - hf_cache:/cache  # weights (HF_HOME) and compiled Triton kernels survive restarts and rebuilds
      - ./data:/app/data:ro  # recordings' frames for the vision smoke test
      - ./scripts:/app/scripts:ro
      - ${SOP_DATASET_DIR:-./sop-sample-training-data}:/dataset:ro
    healthcheck:
      # /health answers only after the model is loaded and graphs are captured; the app also runs a real probe.
      test: ["CMD", "python", "-c", "import json,urllib.request,sys; sys.exit(0 if json.load(urllib.request.urlopen('http://localhost:8001/health'))['ok'] else 1)"]
      interval: 15s
      timeout: 5s
      start_period: 900s  # first start downloads 8.4 GB
      retries: 3
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  # Laya (convaiinnovations/laya, 421M): `docker compose --profile laya up -d laya`. Evaluation only so far.
  laya:
    profiles: [laya]
    build:
      context: .
      dockerfile: docker/laya.Dockerfile
      additional_contexts:
        certs: ${CORP_CA_DIR:-./docker/certs}
    image: sopvision-laya:latest
    ports:
      - "8002:8000"
    environment:
      LAYA_DEVICE: cuda
      LAYA_PRELOAD: "1"
      LAYA_MODELS: english,typed-decisions
      LAYA_MAX_LOADED: "2"
      LAYA_REVISION: reviewed  # the commit SHAs this laya release pins (laya/revisions.py)
      LAYA_MAX_TOKEN_BUDGET: "4096"
      # A fine-tune to serve in place of the shipped English checkpoint, e.g. /data/models/laya-sop-v1 (empty = shipped)
      LAYA_CHECKPOINT: ${LAYA_CHECKPOINT:-}
    volumes:
      - hf_cache:/cache
      - ./data/training/models:/data/models:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      start_period: 600s
      retries: 3
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  tools: &tools
    profiles: [tools]
    build:
      context: .
      target: tools
    image: sopvision:tools
    env_file:
      - path: .env
        required: false
    environment:
      SOP_DATA_ROOT: /data/server_fan
      DATASETS_DIR: /app/datasets
      DECIDER_URL: http://decider:8001
      LAYA_URL: http://laya:8000
      HF_HOME: /cache
    entrypoint: ["python"]
    command: ["--help"]
    volumes:
      - ${SOP_DATASET_DIR:-./sop-sample-training-data}:/data:ro
      - ./src:/app/src:ro
      - ./scripts:/app/scripts:ro
      - ./training:/app/training:ro
      - ./data:/app/data
      - ./datasets:/app/datasets
      - ./models:/app/models
      - ./weights:/app/weights
      - ./sops:/app/sops
      - ./runs:/app/runs
      - ./benchmarks:/app/benchmarks
      - ./yolo26m.pt:/app/yolo26m.pt:ro
      - hf_cache:/cache

  trainer:
    <<: *tools
    profiles: [training]
    entrypoint: ["python", "-m", "training.train"]
    command: ["--help"]
    shm_size: 4gb
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  # Label Studio for reviewing detector labels: `docker compose --profile labelling up -d labelstudio`, then
  # http://localhost:8080. Frames are served from ./data (tasks from training/labelstudio.py with --doc-root data).
  labelstudio:
    profiles: [labelling]
    image: heartexlabs/label-studio:1.15.0
    ports:
      - "8080:8080"
    environment:
      LABEL_STUDIO_LOCAL_FILES_SERVING_ENABLED: "true"
      LABEL_STUDIO_LOCAL_FILES_DOCUMENT_ROOT: /label-studio/files
    volumes:
      - labelstudio_data:/label-studio/data  # projects, annotations, the login
      - ./data:/label-studio/files:ro

volumes:
  hf_cache:
  labelstudio_data:
