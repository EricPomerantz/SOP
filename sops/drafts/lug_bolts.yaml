sop: lug_bolts_torque
name: Wheel lug bolts
version: 1
description: Put five lug bolts into the wheel hub, then torque them with the torque wrench in star sequence 1-3-5-2-4.
detector:
  weights: models/lug_bolts/best.pt
  classes:
  - hub
  - hole_empty
  - lug_bolt_blue
  - lug_bolt_green
  - lug_bolt_red
  - lug_bolt_gold
  - torque_wrench
  - hand
  roles:
    hole_empty: empty
    lug_bolt_blue: part
    lug_bolt_green: part
    lug_bolt_red: part
    lug_bolt_gold: part
layout:
  anchor: hub
  match_radius: 0.15
  tools:
  - torque_wrench
  anchor_follow: 0.7
  removal_seconds: 8
  slots:
    hole_1:
      at:
      - 0.601
      - 0.155
      filled_by:
      - lug_bolt_blue
      - lug_bolt_green
      - lug_bolt_red
      - lug_bolt_gold
      empty_as: hole_empty
    hole_2:
      at:
      - 0.86
      - 0.5
      filled_by:
      - lug_bolt_blue
      - lug_bolt_green
      - lug_bolt_red
      - lug_bolt_gold
      empty_as: hole_empty
    hole_3:
      at:
      - 0.62
      - 0.823
      filled_by:
      - lug_bolt_blue
      - lug_bolt_green
      - lug_bolt_red
      - lug_bolt_gold
      empty_as: hole_empty
    hole_4:
      at:
      - 0.205
      - 0.731
      filled_by:
      - lug_bolt_blue
      - lug_bolt_green
      - lug_bolt_red
      - lug_bolt_gold
      empty_as: hole_empty
    hole_5:
      at:
      - 0.197
      - 0.307
      filled_by:
      - lug_bolt_blue
      - lug_bolt_green
      - lug_bolt_red
      - lug_bolt_gold
      empty_as: hole_empty
steps:
- id: place_1
  label: Bolt 1
  text: Thread a lug bolt into hole 1.
  evidence:
    hole_1: installed
- id: place_2
  label: Bolt 2
  text: Thread a lug bolt into hole 2.
  evidence:
    hole_2: installed
- id: place_3
  label: Bolt 3
  text: Thread a lug bolt into hole 3.
  evidence:
    hole_3: installed
- id: place_4
  label: Bolt 4
  text: Thread a lug bolt into hole 4.
  evidence:
    hole_4: installed
- id: place_5
  label: Bolt 5
  text: Thread a lug bolt into hole 5.
  evidence:
    hole_5: installed
- id: torque_1
  label: Torque 1
  text: Torque the lug bolt in hole 1 with the torque wrench.
  evidence:
    hole_1: torqued
- id: torque_3
  label: Torque 3
  text: Torque the lug bolt in hole 3 with the torque wrench.
  evidence:
    hole_3: torqued
- id: torque_5
  label: Torque 5
  text: Torque the lug bolt in hole 5 with the torque wrench.
  evidence:
    hole_5: torqued
- id: torque_2
  label: Torque 2
  text: Torque the lug bolt in hole 2 with the torque wrench.
  evidence:
    hole_2: torqued
- id: torque_4
  label: Torque 4
  text: Torque the lug bolt in hole 4 with the torque wrench.
  evidence:
    hole_4: torqued
order: groups
groups:
- - place_1
  - place_2
  - place_3
  - place_4
  - place_5
- sequence:
  - torque_1
  - torque_3
  - torque_5
  - torque_2
  - torque_4
off_sop: Any action that is not one of the steps above.
idle: No one is working on the wheel
decisions:
  accept_confidence: 0.8
  hold_seconds: 1
  evidence_only_after: 1
dataset:
  format: timeline
  dir: lug_bolts
