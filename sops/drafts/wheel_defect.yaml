sop: wheel_defect
name: Demo Wheel Defects
version: 1
description: checking wheels for defects
detector:
  weights: models/lug_bolts/best.pt
  classes:
  - hub
  - hole_empty
  - lug_bolt_blue
  - lug_bolt_green
  - lug_bolt_red
  - lug_bolt_gold
  - torque_wrench
  - hand
  roles:
    hole_empty: empty
    lug_bolt_blue: part
    lug_bolt_green: part
    lug_bolt_red: part
    lug_bolt_gold: part
layout:
  anchor: hub
  match_radius: 0.1
  slots: {}
  tools:
  - torque_wrench
steps: []
order: strict
off_sop: Any action that is not one of the steps above.
idle: No one is working.
decisions:
  accept_confidence: 0.8
  hold_seconds: 1
  evidence_only_after: 1
dataset:
  format: timeline
  dir: wheel_defect
